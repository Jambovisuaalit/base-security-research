name: Base FeeVault H1 (standalone)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout official Base contracts
        uses: actions/checkout@v4
        with:
          repository: base/contracts
          path: contracts
      - name: Checkout research tests
        uses: actions/checkout@v4
        with:
          path: research
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned Base dependencies
        working-directory: contracts
        run: |
          forge install --no-git \
            github.com/foundry-rs/forge-std@6853b9ec7df5dc0c213b05ae67785ad4f4baa0ea \
            github.com/OpenZeppelin/openzeppelin-contracts@ecd2ca2cd7cac116f7a37d0e474bbb3d7d5e1c4d \
            github.com/OpenZeppelin/openzeppelin-contracts-upgradeable@0a2cb9a445c365870ed7a8ab461b12acf3e27d63 \
            github.com/transmissions11/solmate@8f9b23f8838670afda0fd8983f2c41e8037ae6bc \
            github.com/Vectorized/solady@502cc1ea718e6fa73b380635ee0868b0740595f0 \
            github.com/base/nitro-validator@0ea0d12366b4fa44f9e07e4755f2ad36561cb674
      - name: Run FeeVault H1
        working-directory: contracts
        run: |
          cp ../research/test/L2/FeeVaultReentrancyH1.t.sol test/L2/FeeVaultReentrancyH1.t.sol
          forge test --match-contract FeeVaultReentrancyH1_Test -vvv
