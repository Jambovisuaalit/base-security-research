name: Base FeeVault H1 + H2 (standalone)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout official Base contracts
        uses: actions/checkout@v4
        with:
          repository: base/contracts
          path: contracts
      - name: Checkout research tests
        uses: actions/checkout@v4
        with:
          path: research
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned Base dependencies
        working-directory: contracts
        run: |
          set -euo pipefail
          mkdir -p lib
          while read -r name url revision; do
            echo "Installing $name at $revision"
            git clone --no-checkout --filter=blob:none "$url" "lib/$name"
            git -C "lib/$name" -c submodule.recurse=false checkout "$revision"
          done <<'DEPS'
          forge-std https://github.com/foundry-rs/forge-std.git 6853b9ec7df5dc0c213b05ae67785ad4f4baa0ea
          openzeppelin-contracts https://github.com/OpenZeppelin/openzeppelin-contracts.git ecd2ca2cd7cac116f7a37d0e474bbb3d7d5e1c4d
          openzeppelin-contracts-upgradeable https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git 0a2cb9a445c365870ed7a8ab461b12acf3e27d63
          solmate https://github.com/transmissions11/solmate.git 8f9b23f8838670afda0fd8983f2c41e8037ae6bc
          solady https://github.com/Vectorized/solady.git 502cc1ea718e6fa73b380635ee0868b0740595f0
          nitro-validator https://github.com/base/nitro-validator.git 0ea0d12366b4fa44f9e07e4755f2ad36561cb674
          DEPS
      - name: Run FeeVault H1 and H2
        working-directory: contracts
        run: |
          cp ../research/test/L2/FeeVaultReentrancyH1.t.sol test/L2/FeeVaultReentrancyH1.t.sol
          cp ../research/test/L2/FeeVaultH2.t.sol test/L2/FeeVaultH2.t.sol
          forge test --match-contract 'FeeVault(ReentrancyH1|H2)_Test' -vvv
